# .\gradlew.bat "-Dgrails.env=loadtest" bootRun --args="--spring.profiles.active=loadtest"
spring:
  config:
    activate:
      on-profile: loadtest
  threads:
    virtual:
      enabled: ${CHIRP_VIRTUAL_THREADS:true}
server:
  port: 8081
dataSource: &loadtestDataSource
  dbCreate: none
  type: demo.chirp.ChirpHikariDataSource
  url: ${CHIRP_JDBC_URL:jdbc:postgresql://localhost:5438/chirp_optimized?tcpKeepAlive=true}
  username: ${CHIRP_JDBC_USER:chirp}
  password: ${CHIRP_JDBC_PASSWORD:chirp}
  properties:
    maximumPoolSize: 16
    minimumIdle: 8
    connectionTimeout: 2000
environments:
  development:
    dataSource: *loadtestDataSource
  test:
    dataSource: *loadtestDataSource
  production:
    dataSource: *loadtestDataSource
  loadtest:
    dataSource: *loadtestDataSource
hibernate:
  osiv:
    enabled: false
  query:
    in_clause_parameter_padding: true
  default_batch_fetch_size: 16
  cache:
    queries: false
    use_second_level_cache: false
    use_query_cache: false
grails:
  plugin:
    databasemigration:
      changelogFileName: changelog.groovy
      updateOnStart: true
      updateOnStartFileName: changelog.groovy
logging:
  level:
    root: WARN
    org.hibernate: WARN
    org.grails: WARN
