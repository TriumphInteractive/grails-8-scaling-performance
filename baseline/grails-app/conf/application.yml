info:
  app:
    name: '@info.app.name@'
    version: '@info.app.version@'
    grailsVersion: '@info.app.grailsVersion@'
dataSource:
  driverClassName: org.postgresql.Driver
  username: postgres
  password: ''
  pooled: true
  jmxExport: true
environments:
  development:
    dataSource:
      dbCreate: create-drop
      url: jdbc:postgresql://localhost:5432/devDb?tcpKeepAlive=true
  test:
    dataSource:
      dbCreate: update
      url: jdbc:postgresql://localhost:5432/testDb?tcpKeepAlive=true
  production:
    dataSource:
      dbCreate: none
      url: jdbc:postgresql://localhost:5432/postgres?tcpKeepAlive=true
  loadtest:
    dataSource:
      driverClassName: org.postgresql.Driver
      dbCreate: none
      url: jdbc:postgresql://localhost:5438/chirp_baseline
      username: chirp
      password: chirp
      pooled: true
      type: demo.chirp.ChirpHikariDataSource
    grails:
      plugin:
        databasemigration:
          changelogFileName: changelog.groovy
          updateOnStart: true
          updateOnStartFileName: changelog.groovy
hibernate:
  cache:
    queries: false
    use_second_level_cache: false
    use_query_cache: false
grails:
  views:
    gsp:
      encoding: UTF-8
      codecs:
        scriptlet: html
  codegen:
    defaultPackage: demo.chirp
  profile: web
