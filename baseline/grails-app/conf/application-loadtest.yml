# .\gradlew.bat "-Dgrails.env=loadtest" bootRun --args="--spring.profiles.active=loadtest"
spring:
  config:
    activate:
      on-profile: loadtest
server:
  port: 8080
dataSource: &loadtestDataSource
  pooled: true
  type: demo.chirp.ChirpHikariDataSource
  dbCreate: none
  url: ${CHIRP_JDBC_URL:jdbc:postgresql://localhost:5438/chirp_baseline}
  username: ${CHIRP_JDBC_USER:chirp}
  password: ${CHIRP_JDBC_PASSWORD:chirp}
environments:
  development:
    dataSource: *loadtestDataSource
  test:
    dataSource: *loadtestDataSource
  production:
    dataSource: *loadtestDataSource
  loadtest:
    dataSource: *loadtestDataSource
grails:
  plugin:
    databasemigration:
      changelogFileName: changelog.groovy
      updateOnStart: true
      updateOnStartFileName: changelog.groovy
logging:
  level:
    root: WARN
    org.hibernate: WARN
    org.grails: WARN
